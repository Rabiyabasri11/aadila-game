<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Number Quest - Guess the Number</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #A7F3D0, #ECFDF5, #FFFFFF);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    overflow-x: hidden;
}

body::before {
    content: "✦ ✧ ✦ ✧ ✦";
    position: fixed;
    top: 8%;
    left: 5%;
    font-size: 35px;
    color: #047857;
    opacity: 0.5;
    letter-spacing: 25px;
    animation: float 5s infinite ease-in-out;
    pointer-events: none;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
}

.game-card {
    width: 100%;
    max-width: 480px;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(15px);
    border: 2px solid #A7F3D0;
    border-radius: 30px;
    padding: 35px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(4, 120, 87, 0.18);
}

.logo {
    font-size: 55px;
    margin-bottom: 10px;
}

h1 {
    color: #064E3B;
    font-size: 32px;
    font-weight: 800;
    margin-bottom: 10px;
}

.subtitle {
    color: #64748B;
    line-height: 1.6;
    margin-bottom: 20px;
}

.range {
    display: inline-block;
    background: #D1FAE5;
    color: #047857;
    padding: 10px 22px;
    border-radius: 50px;
    font-weight: bold;
    margin-bottom: 25px;
}

.input-box {
    background: #F0FDF4;
    border: 2px solid #A7F3D0;
    border-radius: 20px;
    padding: 20px;
}

input {
    width: 100%;
    padding: 15px;
    border: 2px solid #6EE7B7;
    border-radius: 15px;
    outline: none;
    font-size: 18px;
    text-align: center;
    color: #064E3B;
    margin-bottom: 15px;
}

input:focus {
    border-color: #047857;
    box-shadow: 0 0 10px #A7F3D0;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 15px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.guess-btn {
    color: white;
    background: linear-gradient(90deg, #047857, #10B981);
}

.guess-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px #A7F3D0;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 25px 0;
}

.stat {
    padding: 15px 8px;
    border-radius: 18px;
    background: #D1FAE5;
}

.stat:nth-child(2) {
    background: #ECFDF5;
}

.stat:nth-child(3) {
    background: #A7F3D0;
}

.stat p {
    font-size: 13px;
    color: #475569;
    margin-bottom: 8px;
}

.stat h2 {
    font-size: 27px;
    color: #047857;
}

.message {
    padding: 15px;
    border-radius: 15px;
    background: #ECFDF5;
    color: #047857;
    font-weight: bold;
    min-height: 55px;
    margin-bottom: 20px;
    line-height: 1.5;
}

.progress-container {
    width: 100%;
    height: 10px;
    background: #D1FAE5;
    border-radius: 20px;
    margin-bottom: 25px;
    overflow: hidden;
}

.progress {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #047857, #6EE7B7);
    transition: width 0.4s;
}

.restart-btn {
    background: white;
    color: #047857;
    border: 2px solid #6EE7B7;
}

.restart-btn:hover {
    background: #D1FAE5;
    transform: scale(1.02);
}

footer {
    color: #64748B;
    font-size: 12px;
    margin-top: 25px;
}

.win {
    animation: celebrate 0.5s ease-in-out;
}

@keyframes celebrate {
    0% { transform: scale(1); }
    50% { transform: scale(1.04); }
    100% { transform: scale(1); }
}

@media (max-width: 480px) {
    .game-card {
        padding: 22px 16px;
    }

    h1 {
        font-size: 26px;
    }

    .stats {
        gap: 7px;
    }

    .stat h2 {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<div class="game-card" id="gameCard">

    <div class="logo">🎯</div>

    <h1>Number Quest</h1>

    <p class="subtitle">
        ✨ A little guessing, a lot of fun! ✨
        <br>
        Find the secret number hidden between 1 and 100.
    </p>

    <div class="range">
        🔮 Secret Range: 1 - 100
    </div>

    <div class="input-box">

        <form id="guessForm">

            <input
                type="number"
                id="guessInput"
                placeholder="Enter your lucky number..."
                min="1"
                max="100"
                required
            >

            <button type="submit" class="guess-btn" id="guessButton">
                🚀 Check My Guess
            </button>

        </form>

    </div>

    <div class="stats">

        <div class="stat">
            <p>🎯 Attempts</p>
            <h2 id="attempts">0</h2>
        </div>

        <div class="stat">
            <p>🏆 Score</p>
            <h2 id="score">100</h2>
        </div>

        <div class="stat">
            <p>⭐ Best Score</p>
            <h2 id="bestScore">0</h2>
        </div>

    </div>

    <div class="progress-container">
        <div class="progress" id="progress"></div>
    </div>

    <div class="message" id="message">
        🌈 Start guessing! You can do it!
    </div>

    <button class="restart-btn" id="restartButton">
        🔄 Restart Game
    </button>

    <footer>
        Made with 💚 using HTML, CSS & JavaScript
        <br><br>
        © 2026 Number Quest
    </footer>

</div>

<script>

// Generate random number
let secretNumber = Math.floor(Math.random() * 100) + 1;

// Game variables
let attempts = 0;
let score = 100;
let gameOver = false;

// Get HTML elements
const guessForm = document.getElementById("guessForm");
const guessInput = document.getElementById("guessInput");
const guessButton = document.getElementById("guessButton");
const attemptsDisplay = document.getElementById("attempts");
const scoreDisplay = document.getElementById("score");
const bestScoreDisplay = document.getElementById("bestScore");
const message = document.getElementById("message");
const restartButton = document.getElementById("restartButton");
const progress = document.getElementById("progress");
const gameCard = document.getElementById("gameCard");

// Load best score
let bestScore = Number(localStorage.getItem("numberQuestBest")) || 0;

bestScoreDisplay.textContent = bestScore;

// Guess checking
guessForm.addEventListener("submit", function(event) {

    event.preventDefault();

    if (gameOver) {
        return;
    }

    let guess = Number(guessInput.value);

    // Validate number
    if (guess < 1 || guess > 100 || !Number.isInteger(guess)) {
        message.textContent = "⚠️ Enter a whole number from 1 to 100!";
        return;
    }

    attempts++;

    attemptsDisplay.textContent = attempts;

    // Update score
    score = Math.max(0, 100 - (attempts - 1) * 10);

    scoreDisplay.textContent = score;

    // Update progress bar
    progress.style.width = Math.min(attempts * 10, 100) + "%";

    // Check guess
    if (guess === secretNumber) {

        gameOver = true;

        message.textContent =
            "🎉 AMAZING! You found the secret number " +
            secretNumber + "!";

        message.style.background = "#D1FAE5";
        message.style.color = "#047857";

        gameCard.classList.add("win");

        // Save best score
        if (score > bestScore) {

            bestScore = score;

            localStorage.setItem("numberQuestBest", bestScore);

            bestScoreDisplay.textContent = bestScore;

            message.textContent += " 🏆 NEW BEST SCORE!";
        }

        guessButton.disabled = true;
        guessInput.disabled = true;

    } else if (guess < secretNumber) {

        message.textContent =
            "📉 Too Low! Try a bigger number. Keep going!";

        message.style.background = "#DBEAFE";
        message.style.color = "#1D4ED8";

    } else {

        message.textContent =
            "📈 Too High! Try a smaller number. You are close!";

        message.style.background = "#FCE7F3";
        message.style.color = "#BE185D";

    }

    guessInput.value = "";
    guessInput.focus();

});

// Restart game
restartButton.addEventListener("click", function() {

    secretNumber = Math.floor(Math.random() * 100) + 1;

    attempts = 0;
    score = 100;
    gameOver = false;

    attemptsDisplay.textContent = 0;
    scoreDisplay.textContent = 100;

    message.textContent = "🌈 Start guessing! You can do it!";

    message.style.background = "#ECFDF5";
    message.style.color = "#047857";

    progress.style.width = "0%";

    guessInput.disabled = false;
    guessButton.disabled = false;

    guessInput.value = "";

    gameCard.classList.remove("win");

    guessInput.focus();

});

</script>

</body>
</html>
